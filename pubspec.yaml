name: glosseum_frontend
description: "A native mobile application to help with the different chores of visiting a museum."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  go_router: ^17.2.3
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^4.0.2
  json_annotation: ^4.12.0
  json_serializable: ^6.14.0
  freezed_annotation: ^3.1.0
  camera: ^0.12.0+1
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  async: ^2.13.1
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^10.3.1
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  simple_typing_indicator: ^1.0.1
  drift_flutter: ^0.3.1
  drift: ^2.34.3
  uuid: ^4.6.0
  google_mlkit_barcode_scanning: ^0.16.1
  url_launcher: ^6.3.2
  logging: ^1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.0
  freezed: ^3.2.6-dev.1
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true
  assets:
    - 'assets/icons/access_external.svg'
    - 'assets/icons/arrow_left.svg'
    - 'assets/icons/arrow_right.svg'
    - 'assets/icons/camera.svg'
    - 'assets/icons/check.svg'
    - 'assets/icons/clock.svg'
    - 'assets/icons/cross.svg'
    - 'assets/icons/error_icon.svg'
    - 'assets/icons/identify_icon.svg'
    - 'assets/icons/image_to_text_icon.svg'
    - 'assets/icons/minus.svg'
    - 'assets/icons/moon.svg'
    - 'assets/icons/museum_logo.svg'
    - 'assets/icons/plus.svg'
    - 'assets/icons/qr_icon.svg'
    - 'assets/icons/qr_scan_icon.svg'
    - 'assets/icons/search.svg'
    - 'assets/icons/settings.svg'
    - 'assets/icons/sun.svg'
    - 'assets/icons/turn_left.svg'
    - 'assets/icons/turn_right.svg'
    - 'assets/icons/zoom_in.svg'
    - 'assets/icons/zoom_out.svg'

fonts:
  - family: 'Merriweather Sans'
    fonts:
      - asset: fonts/MerriweatherSans-Italic-VariableFont_wgth.ttf
        style: italic
        weight: 800
      - asset: fonts/MerriweatherSans-VariableFont_wgth.ttf
      - asset: fonts/OFL.txt