name: glosseum_frontend
description: "A native mobile application to help with the different chores of visiting a museum."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  go_router: ^17.2.3
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^4.0.2
  json_annotation: ^4.12.0
  json_serializable: ^6.14.0
  freezed_annotation: ^3.1.0
  camera: ^0.12.0+1
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.0
  freezed: ^3.2.6-dev.1

flutter:
  uses-material-design: true
